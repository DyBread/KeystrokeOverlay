
name: Build Keystroke Overlay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # PHẢI tìm sdkmanager trước khi sử dụng
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -print -quit 2>/dev/null)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Found: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify environment
        run: |
          which sdkmanager
          java -version
          gradle --version

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeystrokeOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
